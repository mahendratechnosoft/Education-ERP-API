info:
  name: import
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/import?entityType=UserDetails"
  params:
    - name: entityType
      value: UserDetails
      type: query
    - name: instituteId
      value: ""
      type: query
      disabled: true
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - C:\Users\admin\Downloads\userdetails_import_template.xlsx
        contentType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

