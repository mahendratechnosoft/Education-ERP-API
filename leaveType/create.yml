      value: application/json
  body:
    type: json
    data: "{\r

      \  \"type\": \"Casual Leave\",\r

      \  \"annualLeaveAllocation\": 12,\r

      \  \"unPaid\": false,\r

      \  \"instituteId\": null\r

      }"
