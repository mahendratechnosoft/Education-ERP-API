info:
  name: signin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/signin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "root",
        "password": "1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
