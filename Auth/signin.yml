info:
  name: signin
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/signin"
  body:
    type: json
    data: |-
      {
        "username":"Institute",
        "password":"Pass@123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        var token = jsonData.jwtToken; 

        bru.setEnvVar("bearerToken", token);
        console.log("Token set to: " + bru.getEnvVar("bearerToken"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
