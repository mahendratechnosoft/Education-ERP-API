info:
  name: signin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/signin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "DummyOrg",
        "password": "DummyOrg"
      }  

runtime:
  variables:
    - name: baseUrl
      value: http://91.203.133.210:9093
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        var token = jsonData.jwtToken; 

        bru.setEnvVar("bearerToken", token);
        console.log("Token set to: " + bru.getEnvVar("bearerToken"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
